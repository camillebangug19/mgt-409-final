# One Render web service serving the API and the built React bundle
# (REQUIREMENTS.md 11). Set PORTKEY_API_KEY in the Render dashboard, never here.
services:
  - type: web
    name: readyhome
    runtime: python
    plan: free
    buildCommand: |
      cd frontend && npm ci && npm run build
      cd ../backend && pip install -r requirements.txt
    startCommand: cd backend && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PORTKEY_API_KEY
        sync: false        # set by hand in the dashboard
      - key: PYTHON_VERSION
        value: "3.12.6"
      - key: PYDANTIC_AI_NO_BANNER
        value: "1"
