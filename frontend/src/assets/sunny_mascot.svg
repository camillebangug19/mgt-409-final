<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 280" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <!-- Rays -->
    <g id="rays">
      <g fill="#FFA62B">
        <rect x="-7" y="-92" width="14" height="26" rx="7"/>
        <rect x="-7" y="-92" width="14" height="26" rx="7" transform="rotate(45)"/>
        <rect x="-7" y="-92" width="14" height="26" rx="7" transform="rotate(90)"/>
        <rect x="-7" y="-92" width="14" height="26" rx="7" transform="rotate(135)"/>
        <rect x="-7" y="-92" width="14" height="26" rx="7" transform="rotate(180)"/>
        <rect x="-7" y="-92" width="14" height="26" rx="7" transform="rotate(225)"/>
        <rect x="-7" y="-92" width="14" height="26" rx="7" transform="rotate(270)"/>
        <rect x="-7" y="-92" width="14" height="26" rx="7" transform="rotate(315)"/>
      </g>
    </g>
    <!-- Face base -->
    <g id="face">
      <circle r="58" fill="#FFC93C"/>
      <circle r="58" fill="none" stroke="#F29E1F" stroke-width="3"/>
      <ellipse cx="-34" cy="18" rx="10" ry="6" fill="#FF8A7A" opacity="0.55"/>
      <ellipse cx="34" cy="18" rx="10" ry="6" fill="#FF8A7A" opacity="0.55"/>
    </g>
    <!-- Sunglasses -->
    <g id="shades">
      <path d="M-44 -12 H-6 V0 Q-6 16 -25 16 Q-44 16 -44 0 Z" fill="#1F2A44"/>
      <path d="M6 -12 H44 V0 Q44 16 25 16 Q6 16 6 0 Z" fill="#1F2A44"/>
      <rect x="-8" y="-10" width="16" height="4" rx="2" fill="#1F2A44"/>
      <path d="M-38 -7 L-28 -7 L-36 6 Z" fill="#7FB3FF" opacity="0.7"/>
      <path d="M12 -7 L22 -7 L14 6 Z" fill="#7FB3FF" opacity="0.7"/>
    </g>
  </defs>

  <!-- 1. Hi / default -->
  <g transform="translate(110,120)">
    <use href="#rays"/>
    <use href="#face"/>
    <use href="#shades"/>
    <path d="M-20 26 Q0 42 20 26" fill="none" stroke="#8A4B08" stroke-width="4" stroke-linecap="round"/>
    <!-- waving hand -->
    <g transform="translate(60,20) rotate(40)">
      <rect x="-8" y="-38" width="16" height="40" rx="8" fill="#FFC93C" stroke="#F29E1F" stroke-width="3"/>
      <circle cx="0" cy="-42" r="11" fill="#FFC93C" stroke="#F29E1F" stroke-width="3"/>
    </g>
  </g>
  <text x="110" y="250" text-anchor="middle" font-size="16" fill="#1F2A44" font-weight="bold">Hi! (default)</text>

  <!-- 2. Thinking -->
  <g transform="translate(330,120)">
    <use href="#rays"/>
    <use href="#face"/>
    <g transform="rotate(-6)"><use href="#shades"/></g>
    <path d="M-10 30 Q4 34 16 26" fill="none" stroke="#8A4B08" stroke-width="4" stroke-linecap="round"/>
    <g fill="#1F2A44">
      <circle cx="58" cy="-62" r="5"/><circle cx="74" cy="-74" r="6"/><circle cx="92" cy="-86" r="7"/>
    </g>
  </g>
  <text x="330" y="250" text-anchor="middle" font-size="16" fill="#1F2A44" font-weight="bold">Thinking…</text>

  <!-- 3. Cheering -->
  <g transform="translate(550,120)">
    <use href="#rays"/>
    <use href="#face"/>
    <use href="#shades"/>
    <path d="M-22 22 Q0 50 22 22 Z" fill="#8A4B08"/>
    <path d="M-12 32 Q0 42 12 32" fill="#FF8A7A"/>
    <g fill="#FFA62B">
      <path d="M-82 -60 l4 10 10 4 -10 4 -4 10 -4 -10 -10 -4 10 -4z"/>
      <path d="M80 -50 l3 8 8 3 -8 3 -3 8 -3 -8 -8 -3 8 -3z"/>
      <path d="M76 50 l3 7 7 3 -7 3 -3 7 -3 -7 -7 -3 7 -3z"/>
    </g>
  </g>
  <text x="550" y="250" text-anchor="middle" font-size="16" fill="#1F2A44" font-weight="bold">Cheering!</text>

  <!-- 4. Calm / caring (shades pushed up, kind eyes) -->
  <g transform="translate(770,120)">
    <use href="#rays"/>
    <use href="#face"/>
    <g transform="translate(0,-30) scale(0.85)"><use href="#shades"/></g>
    <path d="M-30 4 Q-22 -4 -14 4" fill="none" stroke="#8A4B08" stroke-width="4" stroke-linecap="round"/>
    <path d="M14 4 Q22 -4 30 4" fill="none" stroke="#8A4B08" stroke-width="4" stroke-linecap="round"/>
    <path d="M-14 28 Q0 36 14 28" fill="none" stroke="#8A4B08" stroke-width="4" stroke-linecap="round"/>
  </g>
  <text x="770" y="250" text-anchor="middle" font-size="16" fill="#1F2A44" font-weight="bold">Calm (sensitive topics)</text>
</svg>
